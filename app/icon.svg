<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente de Fundo Luxo Esmeralda Profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradiente Ouro Champagne e Rosé -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Suave -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Borda Fina de Ouro Dupla -->
  <rect x="20" y="20" width="472" height="472" rx="104" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="32" y="32" width="448" height="448" rx="92" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Sobrancelha Elegante Arqueada (Design Geométrico) -->
  <path d="M120 185 C170 145, 270 135, 390 175 C350 172, 250 162, 120 185 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- Pálpebra / Curvatura Superior dos Olhos -->
  <path d="M140 255 C200 215, 310 215, 370 255" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Curvatura Inferior do Olho Fechado em Repouso -->
  <path d="M165 260 C215 285, 295 285, 345 260" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Fios de Extensão de Cílios Volume Russo Longos e Perfeitos -->
  <path d="M160 250 C150 200, 135 170, 120 160" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M185 240 C178 185, 170 155, 150 140" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M215 232 C210 170, 205 140, 190 120" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M245 228 C248 165, 245 130, 235 110" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M275 228 C285 165, 290 130, 285 110" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M305 232 C325 172, 335 140, 340 120" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M335 240 C360 185, 380 155, 395 140" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M360 252 C395 205, 420 180, 440 165" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Estrela de Diamante Brilhante (Sparkle Maior) -->
  <g transform="translate(415, 120)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Estrela de Brilho Menor -->
  <g transform="translate(100, 210) scale(0.6)">
    <path d="M0 -25 Q0 0 25 0 Q0 0 0 25 Q0 0 -25 0 Q0 0 0 -25 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Monograma Sofisticado / Tipografia Oficial -->
  <text x="256" y="380" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="8">
    BRUNA MEIRELES
  </text>
  <text x="256" y="420" font-family="'Montserrat', 'Inter', sans-serif" font-size="16" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="12">
    STUDIO &amp; BEAUTY
  </text>

  <!-- Linha Decorativa Divisora em Ouro -->
  <line x1="170" y1="340" x2="342" y2="340" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="256" cy="340" r="3" fill="url(#goldGrad)"/>
</svg>
